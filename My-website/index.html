<!doctype html>
<html lang="ru">
  <head>
    <title>making lists</title>
  </head>
  <body>
    <p>Вещи, которые я ненавижу</p>
    <ul style="list-style-type: square">
      <li>Списки</li>
      <li>Ирония</li>
    </ul>

    <p>План тренировок</p>
    <ul>
      <li>
        Утром
        <ol>
          <li>Прес качат</li>
          <li>Бегит</li>
          <li>Турник</li>
          <li>Анжумання</li>
        </ol>
      </li>

      <li>
        Вечером
        <ol>
          <li>Прес качат</li>
          <li>Бегит</li>
          <li>Турник</li>
          <li>Анжумання</li>
        </ol>
      </li>
    </ul>
  </body>
</html>
